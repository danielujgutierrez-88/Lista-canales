<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fénix TV - Filtro AI</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #d4af37; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .reproductor-box { position: sticky; top: 0; background: #000; z-index: 100; border-bottom: 2px solid #d4af37; }
        video { width: 100%; aspect-ratio: 16/9; background: #111; }
        
        .panel-control { background: #1a1a1a; padding: 15px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #333; }
        .slider-container { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 12px; }
        input[type=range] { flex: 1; accent-color: #d4af37; }

        .lista-canales { flex: 1; overflow-y: auto; padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .btn-canal { background: #222; border: 1px solid #333; padding: 12px 5px; color: #fff; border-radius: 8px; font-size: 10px; display: block; }
        .btn-canal.caido { display: none; } /* El filtro oculta los que no andan */
    </style>
</head>
<body>

<div class="reproductor-box">
    <video id="player" controls autoplay playsinline></video>
    <div class="panel-control">
        <div class="slider-container">
            <span>VOL</span>
            <input type="range" min="0" max="1" step="0.1" value="1" oninput="controlVol(this.value)">
        </div>
        <div class="slider-container">
            <span>BRILLO</span>
            <input type="range" min="30" max="150" value="100" oninput="controlBri(this.value)">
        </div>
        <button onclick="activarPiP()" style="background:#333; color:#fff; border:none; padding:5px; border-radius:5px; font-size:10px;">PANTALLA FLOTANTE (PiP)</button>
    </div>
</div>

<div class="lista-canales">
    <div style="font-size: 12px; margin-bottom: 10px;">SINTONIZANDO SEÑALES ACTIVAS...</div>
    <div class="grid" id="contenedor"></div>
</div>

<script>
    const player = document.getElementById('player');
    let hls = new Hls();

    function sintonizar(url) {
        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(player);
            player.play();
        } else { player.src = url; }
    }

    function controlVol(v) { player.volume = v; }
    function controlBri(b) { document.body.style.filter = `brightness(${b}%)`; }

    async function activarPiP() {
        try { await player.requestPictureInPicture(); } catch (e) { alert("PiP no disponible"); }
    }

    async function cargarYFiltrar() {
        const res = await fetch("https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u");
        const data = await res.text();
        const lineas = data.split('\n');
        const contenedor = document.getElementById('contenedor');

        for (let i = 0; i < lineas.length; i++) {
            if (lineas[i].includes('#EXTINF')) {
                const nombre = lineas[i].split(',')[1].trim();
                const url = lineas[i+1]?.trim();

                if (url && url.startsWith('http')) {
                    const btn = document.createElement('button');
                    btn.className = 'btn-canal';
                    btn.innerText = nombre;
                    btn.onclick = () => sintonizar(url);
                    contenedor.appendChild(btn);

                    // --- FILTRO INTELIGENTE ---
                    // Intenta "saludar" al link. Si el link no responde, borra el botón.
                    fetch(url, { method: 'HEAD', mode: 'no-cors' }).catch(() => {
                        btn.classList.add('caido');
                    });
                }
            }
        }
    }
    cargarYFiltrar();
</script>
</body>
</html>
