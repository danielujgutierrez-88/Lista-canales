<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Súper Fénix - Agenda Total</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root { --oro: #d4af37; --celeste: #74acdf; }
body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
.panel-izq { flex: 1.5; display: flex; flex-direction: column; border-right: 2px solid var(--oro); }
video { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid var(--oro); }
.agenda { flex: 1; overflow-y: auto; padding: 15px; background: rgba(0,0,0,0.9); }
.p-card { background: rgba(255,255,255,0.05); border-left: 5px solid var(--oro); padding: 12px; margin-bottom: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
.info-p b { color: var(--celeste); font-size: 10px; text-transform: uppercase; display: block; }
.info-p span { font-size: 12px; font-weight: bold; }
.hora-p { text-align: right; }
.sidebar { flex: 0.8; background: #050505; overflow-y: auto; padding: 10px; }
.btn-v { background: #1a1a1a; border: 1px solid #333; padding: 15px 5px; color: #fff; border-radius: 8px; font-size: 10px; margin-bottom: 10px; text-align: center; font-weight: bold; width: 100%; cursor: pointer; }
.btn-v:active { background: var(--oro); color: #000; }
.sec-t { font-size: 10px; color: var(--oro); text-align: center; margin: 20px 0 10px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; }
</style>
</head>
<body>
<div class="panel-izq">
<video id="f-player" controls autoplay playsinline></video>
<div class="agenda">
<div style="font-size:12px; color:var(--oro); font-weight:bold; margin-bottom:15px;">📅 PRÓXIMOS PARTIDOS DESTACADOS</div>
<div id="lista-p">
    <div class="p-card">
        <div class="info-p"><b>DOMINGO 26/04 - SERIE A 🇮🇹</b><span>Inter vs Milan</span><br><small style="color:#888">ESPN / Disney+</small></div>
        <div class="hora-p"><div style="color:var(--oro); font-weight:900; font-size:18px;">15:45</div></div>
    </div>
    <div class="p-card">
        <div class="info-p"><b>DOMINGO 26/04 - ARGENTINA 🇦🇷</b><span>Boca vs Racing</span><br><small style="color:#888">TNT Sports</small></div>
        <div class="hora-p"><div style="color:var(--oro); font-weight:900; font-size:18px;">21:00</div></div>
    </div>
    <div class="p-card">
        <div class="info-p"><b>LUNES 27/04 - ESPAÑA 🇪🇸</b><span>Barcelona vs Osasuna</span><br><small style="color:#888">DSports</small></div>
        <div class="hora-p"><div style="color:var(--oro); font-weight:900; font-size:18px;">16:00</div></div>
    </div>
</div>
</div>
</div>
<div class="sidebar">
<div class="sec-t">🏆 CANALES ACTIVOS</div>
<div id="box-dep"></div>
<div class="sec-t" style="color:#444">📺 CABLE GENERAL</div>
<div id="box-gen"></div>
</div>
<script>
const video = document.getElementById('f-player');
const hls = new Hls();
function play(u) {
    if (Hls.isSupported()) { hls.detachMedia(); hls.loadSource(u); hls.attachMedia(video); video.play(); }
    else { video.src = u; }
}
async function sync() {
    const res = await fetch("https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u");
    const data = await res.text();
    const lines = data.split('\n');
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes('#EXTINF')) {
            const n = lines[i].split(',')[1].trim();
            const u = lines[i+1]?.trim();
            if (u && u.startsWith('http')) {
                const btn = document.createElement('div');
                btn.className = 'btn-v';
                btn.innerText = n;
                btn.onclick = () => play(u);
                const ln = n.toLowerCase();
                if (ln.includes('espn') || ln.includes('tnt') || ln.includes('fox') || ln.includes('tyc') || ln.includes('dsports')) {
                    document.getElementById('box-dep').appendChild(btn);
                } else {
                    document.getElementById('box-gen').appendChild(btn);
                }
                // Si el canal no responde rápido, se oculta
                const ab = new AbortController();
                setTimeout(() => ab.abort(), 600);
                fetch(u, { method: 'HEAD', mode: 'no-cors', signal: ab.signal }).catch(() => btn.remove());
            }
        }
    }
}
sync();
</script>
</body>
</html>
