<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fénix TV AI Plus</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #d4af37; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .reproductor { width: 100%; background: #000; border-bottom: 2px solid #d4af37; flex-shrink: 0; }
        video { width: 100%; aspect-ratio: 16/9; }
        .info-canal { padding: 5px; font-size: 12px; text-align: center; background: #111; color: #fff; border-bottom: 1px solid #333; }
        .lista-contenedor { flex: 1; overflow-y: auto; padding: 10px; background: linear-gradient(to bottom, #000, #111); }
        .seccion { border-left: 3px solid #d4af37; padding-left: 10px; margin: 15px 0 10px; font-size: 14px; font-weight: bold; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .btn-smart { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px 5px; color: #fff; font-size: 10px; cursor: pointer; position: relative; }
        .btn-smart.error { opacity: 0.4; border-color: #ff0000; }
        .btn-smart.activo { border-color: #d4af37; background: #222; box-shadow: 0 0 5px #d4af37; }
        #loading { text-align: center; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

<div class="reproductor">
    <video id="player" controls autoplay></video>
    <div class="info-canal" id="titulo-reproduciendo">Seleccioná un canal para empezar</div>
</div>

<div class="lista-contenedor">
    <div class="seccion">💎 Principales (Sincronizados)</div>
    <div class="grid" id="destacados">
        <button class="btn-smart" onclick="play('https://television-libre.online/pasatv/espn.m3u8', 'ESPN')">ESPN</button>
        <button class="btn-smart" onclick="play('https://television-libre.online/pasatv/tntsports.m3u8', 'TNT SPORTS')">TNT SPORTS</button>
        <button class="btn-smart" onclick="play('https://television-libre.online/pasatv/cronica.m3u8', 'CRÓNICA TV')">CRÓNICA</button>
        <button class="btn-smart" onclick="play('https://television-libre.online/pasatv/c5n.m3u8', 'C5N')">C5N</button>
        <button class="btn-smart" onclick="play('https://television-libre.online/pasatv/telefe.m3u8', 'TELEFE')">TELEFE</button>
    </div>

    <div class="seccion">🇦🇷 Resto de Grilla (Filtro AI)</div>
    <div id="loading">Sincronizando señales...</div>
    <div class="grid" id="lista-ia"></div>
</div>

<script>
    const video = document.getElementById('player');
    const hls = new Hls();
    const titulo = document.getElementById('titulo-reproduciendo');

    function play(url, nombre) {
        titulo.innerText = "Reproduciendo: " + nombre;
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
            video.play();
        } else {
            video.src = url;
            video.play();
        }
    }

    async function cargarGrilla() {
        try {
            const res = await fetch("https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u");
            const data = await res.text();
            const lineas = data.split('\n');
            const contenedor = document.getElementById('lista-ia');
            document.getElementById('loading').style.display = 'none';

            for (let i = 0; i < lineas.length; i++) {
                if (lineas[i].includes('#EXTINF')) {
                    const nombre = lineas[i].split(',')[1].trim();
                    const url = lineas[i+1]?.trim();

                    // Inteligencia de descarte: solo canales que no sean los repetidos de arriba
                    if (url && url.startsWith('http') && !['Telefe', 'C5N', 'Cronica', 'ESPN'].some(ex => nombre.includes(ex))) {
                        const btn = document.createElement('button');
                        btn.className = 'btn-smart';
                        btn.innerText = nombre;
                        btn.onclick = () => play(url, nombre);
                        contenedor.appendChild(btn);
                    }
                }
            }
        } catch (e) {
            document.getElementById('loading').innerText = "Error de conexión";
        }
    }
    cargarGrilla();
</script>
</body>
</html>
