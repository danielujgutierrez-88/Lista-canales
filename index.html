<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Súper Fénix - Vivo</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root { --oro: #d4af37; --celeste: #74acdf; }
body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
.fondo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle, #001a33 0%, #000 100%); opacity: 0.6; }
.panel-izq { flex: 1.5; display: flex; flex-direction: column; border-right: 2px solid var(--oro); }
video { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid var(--oro); box-shadow: 0 0 20px rgba(212,175,55,0.3); }
.agenda { flex: 1; overflow-y: auto; padding: 15px; background: rgba(0,0,0,0.8); }
.p-card { background: rgba(255,255,255,0.05); border-left: 5px solid var(--oro); padding: 12px; margin-bottom: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
.info-p b { color: var(--celeste); font-size: 10px; text-transform: uppercase; }
.info-p p { margin: 4px 0; font-size: 13px; font-weight: bold; }
.hora-p { font-size: 20px; font-weight: 900; color: var(--oro); }
.sidebar { flex: 0.8; background: #080808; overflow-y: auto; padding: 10px; }
.btn-v { background: #1a1a1a; border: 1px solid #333; padding: 15px 5px; color: #fff; border-radius: 8px; font-size: 10px; margin-bottom: 10px; text-align: center; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s; }
.btn-v:active { background: var(--oro); color: #000; transform: scale(0.95); }
.sec-t { font-size: 10px; color: var(--oro); text-align: center; margin: 20px 0 10px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; }
.loading { font-size: 9px; color: #555; text-align: center; }
</style>
</head>
<body>
<div class="fondo"></div>
<div class="panel-izq">
<video id="f-player" controls autoplay playsinline></video>
<div class="agenda">
<div style="font-size:12px; color:var(--oro); font-weight:bold; margin-bottom:15px;">⚽ PARTIDOS CRÍTICOS - HOY 26/04</div>
<div id="lista-p">
<div class="p-card"><div class="info-p"><b>ARGENTINA - LPF</b><p>Boca Juniors vs Racing</p><span style="font-size:9px; color:#aaa;">TNT SPORTS / ESPN PREMIUM</span></div><div class="hora-p">21:00</div></div>
<div class="p-card"><div class="info-p"><b>ESPAÑA - LALIGA</b><p>Real Madrid vs Villarreal</p><span style="font-size:9px; color:#aaa;">DSPORTS / ESPN</span></div><div class="hora-p">16:00</div></div>
<div class="p-card"><div class="info-p"><b>INGLATERRA - PREMIER</b><p>Arsenal vs Liverpool</p><span style="font-size:9px; color:#aaa;">ESPN 2</span></div><div class="hora-p">12:30</div></div>
</div>
</div>
</div>
<div class="sidebar">
<div class="sec-t">🏆 CANALES DE LA AGENDA</div>
<div id="box-top"></div>
<div class="sec-t" style="color:#555;">📺 RESTO DE SEÑALES</div>
<div id="box-others"></div>
</div>
<script>
const video = document.getElementById('f-player');
const hls = new Hls();
function play(u, n) {
if (Hls.isSupported()) { hls.detachMedia(); hls.loadSource(u); hls.attachMedia(video); video.play(); }
else { video.src = u; }
}
async function sync() {
// Usamos tres fuentes de respaldo para asegurar que el canal "ande"
const sources = [
"https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u",
"https://iptv-org.github.io/iptv/countries/ar.m3u"
];
for(let s of sources) {
try {
const res = await fetch(s);
const data = await res.text();
const lines = data.split('\n');
for (let i = 0; i < lines.length; i++) {
if (lines[i].includes('#EXTINF')) {
const n = lines[i].split(',')[1].trim();
const u = lines[i+1]?.trim();
if (u && u.startsWith('http')) {
const btn = document.createElement('div');
btn.className = 'btn-v';
btn.innerText = n;
btn.onclick = () => play(u, n);
const ln = n.toLowerCase();
// Prioridad absoluta a los canales de la agenda
if (ln.includes('tnt') || ln.includes('espn') || ln.includes('tyc') || ln.includes('fox') || ln.includes('dsports')) {
document.getElementById('box-top').appendChild(btn);
} else { document.getElementById('box-others').appendChild(btn); }
// TESTER IA: Si no responde en 0.5s, se borra el botón
const ab = new AbortController();
setTimeout(() => ab.abort(), 500);
fetch(u, { method: 'HEAD', mode: 'no-cors', signal: ab.signal }).catch(() => btn.remove());
}
}
}
} catch(e) {}
}
}
sync();
</script>
</body>
</html>
