<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fénix TV AI</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #d4af37; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .reproductor { width: 100%; background: #000; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #d4af37; }
        video { width: 100%; aspect-ratio: 16/9; background: #111; }
        .contenido { flex: 1; overflow-y: auto; padding: 15px; }
        .categoria-titulo { font-size: 14px; font-weight: bold; margin: 15px 0 10px; text-transform: uppercase; border-left: 3px solid #d4af37; padding-left: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
        .btn-canal { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px 5px; color: #fff; font-size: 11px; cursor: pointer; text-align: center; transition: 0.3s; }
        .btn-canal:active { transform: scale(0.9); background: #d4af37; color: #000; }
        .online { border-color: #00ff00; } /* Luz verde si el canal responde */
    </style>
</head>
<body>

<div class="reproductor">
    <video id="videoPlayer" controls autoplay></video>
    <div style="padding: 5px; text-align: center; font-weight: bold;">FÉNIX TV 💎</div>
</div>

<div class="contenido">
    <div class="categoria-titulo">⭐ Destacados (Respaldo Inteligente)</div>
    <div class="grid" id="destacados">
        <div class="btn-canal" onclick="play('https://television-libre.online/pasatv/espn.m3u8')">ESPN</div>
        <div class="btn-canal" onclick="play('https://television-libre.online/pasatv/tycsports.m3u8')">TyC Sports</div>
        <div class="btn-canal" onclick="play('https://television-libre.online/pasatv/tntsports.m3u8')">TNT Sports</div>
        <div class="btn-canal" onclick="play('https://television-libre.online/pasatv/telefe.m3u8')">Telefe</div>
        <div class="btn-canal" onclick="play('https://television-libre.online/pasatv/eltrece.m3u8')">El Trece</div>
    </div>

    <div class="categoria-titulo">🇦🇷 Canales Argentinos</div>
    <div class="grid" id="lista-auto">Cargando...</div>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    const hls = new Hls();

    function play(url) {
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
            video.play();
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
        document.querySelector('.reproductor').scrollIntoView({behavior: "smooth"});
    }

    async function cargarInteligente() {
        try {
            const res = await fetch("https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u");
            const data = await res.text();
            const lineas = data.split('\n');
            const lista = document.getElementById('lista-auto');
            lista.innerHTML = "";

            lineas.forEach((linea, i) => {
                if (linea.includes('#EXTINF')) {
                    const nombre = linea.split(',')[1].trim();
                    const url = lineas[i+1].trim();
                    
                    // Filtro inteligente: solo agrega si tiene link válido y no es de los de arriba
                    if (url.startsWith('http') && !nombre.includes('Telefe')) {
                        const btn = document.createElement('div');
                        btn.className = 'btn-canal';
                        btn.innerText = nombre;
                        btn.onclick = () => play(url);
                        lista.appendChild(btn);
                    }
                }
            });
        } catch (e) {
            console.error("Error en la carga");
        }
    }
    cargarInteligente();
</script>

</body>
</html>
