<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fénix TV - Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --oro: #d4af37; --vidrio: rgba(255, 255, 255, 0.07); }
        body { 
            background: #000; color: #fff; font-family: sans-serif; margin: 0; 
            display: flex; height: 100vh; overflow: hidden;
            background-image: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Flag_of_Argentina.svg/1200px-Flag_of_Argentina.svg.png');
            background-size: cover;
        }
        
        .pantalla { flex: 1; display: flex; flex-direction: column; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; box-shadow: 0 5px 20px #000; }

        .controles-cristal { padding: 12px; background: var(--vidrio); backdrop-filter: blur(20px); border-bottom: 1px solid var(--oro); }
        .titulo-canal { font-size: 10px; color: var(--oro); text-align: center; font-weight: bold; margin-bottom: 8px; }

        /* Panel Interesante de Abajo */
        .panel-fénix { 
            margin-top: auto; padding: 20px; background: rgba(0,0,0,0.8); 
            border-top: 2px solid var(--oro); text-align: center;
        }
        #reloj { font-size: 28px; font-weight: bold; color: #fff; text-shadow: 0 0 10px var(--oro); }
        .btn-update { background: #222; border: 1px solid var(--oro); color: var(--oro); padding: 8px; border-radius: 5px; font-size: 10px; margin-top: 10px; width: 100%; }

        /* Sidebar con Filtro Estricto */
        .sidebar { width: 140px; background: rgba(0,0,0,0.9); border-left: 1px solid var(--oro); overflow-y: auto; padding: 8px; }
        .tag { font-size: 9px; padding: 4px; margin-top: 12px; text-align: center; border-radius: 3px; font-weight: bold; }
        .t-dep { background: var(--oro); color: #000; }
        .t-gen { background: #444; color: #fff; }

        .btn-tv { 
            background: rgba(255,255,255,0.05); border: 1px solid #333; 
            padding: 10px 4px; color: #eee; border-radius: 6px; font-size: 9px; margin-bottom: 6px;
            text-align: center; cursor: pointer;
        }
        .btn-tv:active { background: var(--oro); color: #000; }

        .hidden { display: none !important; }
        #unblock { position: fixed; top: 20px; left: 20px; z-index: 10000; background: var(--oro); border: none; width: 50px; height: 50px; border-radius: 50%; display: none; font-size: 20px; }
    </style>
</head>
<body>

<button id="unblock" onclick="lockUI(false)">🔓</button>

<div class="pantalla" id="view">
    <video id="player" controls autoplay playsinline></video>
    
    <div id="ui-top" class="controles-cristal">
        <div id="info" class="titulo-canal">FÉNIX TV: BUSCANDO SEÑAL...</div>
        <input type="range" min="0" max="1" step="0.1" value="1" id="v" style="width:100%; accent-color:var(--oro);">
        <button onclick="lockUI(true)" style="background:var(--oro); border:none; width:100%; padding:8px; font-weight:bold; font-size:10px; border-radius:4px; margin-top:5px;">🔒 MODO NIÑOS</button>
    </div>

    <div class="panel-fénix" id="ui-bot">
        <div id="reloj">00:00:00</div>
        <div style="font-size: 9px; color: var(--oro); margin-top: 5px;">ESTADO: ESCANEANDO CANALES</div>
        <button class="btn-update" onclick="location.reload()">🔄 RECARGAR GUÍA</button>
    </div>
</div>

<div id="side" class="sidebar">
    <div class="tag t-dep">🏆 DEPORTES</div>
    <div id="dep"></div>
    <div class="tag t-gen">📺 GENERAL</div>
    <div id="gen"></div>
</div>

<script>
    const player = document.getElementById('player');
    const hls = new Hls();
    
    // Reloj en tiempo real
    setInterval(() => {
        document.getElementById('reloj').innerText = new Date().toLocaleTimeString();
    }, 1000);

    function play(url, n) {
        document.getElementById('info').innerText = "VIENDO: " + n;
        if (Hls.isSupported()) {
            hls.detachMedia(); hls.loadSource(url); hls.attachMedia(player); player.play();
        } else { player.src = url; }
    }

    function lockUI(on) {
        document.getElementById('ui-top').classList.toggle('hidden', on);
        document.getElementById('ui-bot').classList.toggle('hidden', on);
        document.getElementById('side').classList.toggle('hidden', on);
        document.getElementById('unblock').style.display = on ? 'block' : 'none';
        if(on && player.requestFullscreen) { player.parentElement.requestFullscreen().catch(()=>{}); }
    }

    async function load() {
        const res = await fetch("https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u");
        const data = await res.text();
        const lines = data.split('\n');
        
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes('#EXTINF')) {
                const name = lines[i].split(',')[1].trim();
                const url = lines[i+1]?.trim();
                
                if (url && url.startsWith('http')) {
                    const b = document.createElement('div');
                    b.className = 'btn-tv';
                    b.innerText = name;
                    b.onclick = () => play(url, name);
                    
                    const low = name.toLowerCase();
                    if (low.includes('sport') || low.includes('tyc') || low.includes('fox') || low.includes('espn') || low.includes('depor')) {
                        document.getElementById('dep').appendChild(b);
                    } else {
                        document.getElementById('gen').appendChild(b);
                    }
                    
                    // FILTRO ULTRA RÁPIDO: Si no responde en 2.5 seg, se borra
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 2500);
                    fetch(url, { method: 'HEAD', mode: 'no-cors', signal: controller.signal })
                        .catch(() => b.remove());
                }
            }
        }
    }
    load();
</script>
</body>
</html>
