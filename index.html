<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fénix TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #050505; color: #d4af37; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; text-align: center; }
        h1 { margin-bottom: 30px; text-shadow: 2px 2px #000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .btn { background: #1a1a1a; border: 1px solid #d4af37; padding: 20px; border-radius: 12px; color: #fff; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn:hover { background: #d4af37; color: #000; }
        video { width: 100%; max-width: 700px; border: 3px solid #d4af37; border-radius: 15px; margin-bottom: 30px; display: none; box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
    </style>
</head>
<body>
    <h1>FÉNIX TV 💎</h1>
    <video id="video" controls autoplay></video>
    <div class="grid" id="lista">Cargando guía de canales...</div>

    <script>
        const video = document.getElementById('video');
        const lista = document.getElementById('lista');
        const fuenteRespaldo = "https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u";

        async function cargarCanales() {
            try {
                const res = await fetch(fuenteRespaldo);
                const data = await res.text();
                const lineas = data.split('\n');
                lista.innerHTML = "";
                
                lineas.forEach((linea, i) => {
                    if (linea.includes('#EXTINF')) {
                        const nombre = linea.split(',')[1].trim();
                        const url = lineas[i+1].trim();
                        if (url.startsWith('http')) {
                            const boton = document.createElement('div');
                            boton.className = 'btn';
                            boton.innerText = nombre;
                            boton.onclick = () => {
                                video.style.display = "block";
                                if (Hls.isSupported()) {
                                    const hls = new Hls();
                                    hls.loadSource(url);
                                    hls.attachMedia(video);
                                    video.play();
                                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                    video.src = url;
                                    video.play();
                                }
                                window.scrollTo(0,0);
                            };
                            lista.appendChild(boton);
                        }
                    }
                });
            } catch (e) {
                lista.innerText = "Error al cargar los canales de respaldo.";
            }
        }
        cargarCanales();
    </script>
</body>
</html>
