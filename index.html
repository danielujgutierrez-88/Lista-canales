<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SÚPER FÉNIX - MOTOR DUAL</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #1a1a1a; }
        body { background: var(--negro); color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        #reproductor { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid var(--oro); position: sticky; top: 0; z-index: 1000; }
        video { width: 100%; height: 100%; }
        .contenido { padding: 15px; }
        .status { font-size: 10px; color: var(--oro); text-align: center; padding: 5px; background: #111; text-transform: uppercase; }
        .titulo { color: var(--oro); font-size: 14px; font-weight: bold; margin: 20px 0 10px 0; border-left: 3px solid var(--oro); padding-left: 10px; }
        .grilla { display: grid; gap: 10px; }
        .btn-partido { background: var(--gris); border: 1px solid #333; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .btn-partido:active { background: #222; }
        .badge { background: red; color: white; font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: bold; animation: parpadeo 1.5s infinite; }
        @keyframes parpadeo { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        .hora { color: var(--oro); font-weight: bold; }
    </style>
</head>
<body>

<div id="reproductor">
    <video id="video" controls autoplay playsinline></video>
</div>
<div id="motor-status" class="status">Sincronizando Motor con GitHub...</div>

<div class="contenido">
    <div class="titulo">📺 TELEVISIÓN LOCAL (AUTO)</div>
    <div id="lista-canales" style="font-size: 12px; color: #888;">Conectando a señales de Argentina...</div>

    <div class="titulo">⚽ AGENDA AUTOMÁTICA (ESPEJO)</div>
    <div id="grilla-espejo" class="grilla">
        <p style="font-size: 12px; color: #555;">Buscando partidos en vivo...</p>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const hls = new Hls();
    const status = document.getElementById('motor-status');
    const repoSignals = "https://raw.githubusercontent.com/free-tv/iptv/main/playlist.m3u8";

    // 1. MOTOR DE ARRANQUE: Tele Local
    async function encenderMotor() {
        try {
            const res = await fetch(repoSignals);
            const data = await res.text();
            const lineas = data.split('\n');
            
            // Busca Telefe, Crónica o Canal 5 para arrancar
            for(let i=0; i<lineas.length; i++) {
                if(lineas[i].includes("Argentina") && (lineas[i].includes("Telefe") || lineas[i].includes("Cronica") || lineas[i].includes("C5N"))) {
                    cargarStream(lineas[i+1].trim());
                    status.innerHTML = "MOTOR ONLINE: " + (lineas[i].split(',')[1] || "TV Local");
                    break;
                }
            }
        } catch(e) { status.innerHTML = "Falla de Motor: Reintentando..."; }
    }

    // 2. SCRIPT ESPEJO: Detecta Agenda y resultados tipo Betano
    async function motorEspejo() {
        const grilla = document.getElementById('grilla-espejo');
        try {
            // Este link es el "cable" de datos que se actualiza solo
            const res = await fetch('https://raw.githubusercontent.com/Santi-68/agenda-deportiva/main/hoy.json');
            const agenda = await res.json();
            
            grilla.innerHTML = "";
            agenda.eventos.forEach(partido => {
                const item = document.createElement('div');
                item.className = 'btn-partido';
                item.onclick = () => buscadorInteligente(partido.nombre, partido.canal_sugerido);
                item.innerHTML = `
                    <div>
                        <span class="badge">VIVO</span><br>
                        <b style="font-size:14px">${partido.nombre}</b><br>
                        <small style="color:#888">${partido.torneo}</small>
                    </div>
                    <div class="hora">${partido.hora}</div>
                `;
                grilla.appendChild(item);
            });
        } catch(e) {
            grilla.innerHTML = "<p style='color:var(--oro); font-size:12px'>Sincronizando agenda de mañana (Boca vs Cruzeiro)...</p>";
        }
    }

    // 3. BUSCADOR INTELIGENTE: Rastrea señales en Argentina, Chile o Brasil
    async function buscadorInteligente(evento, sugerido) {
        status.innerHTML = "Buscando señal para " + evento + "...";
        const res = await fetch(repoSignals);
        const data = await res.text();
        const lineas = data.split('\n');
        let hallado = "";

        for(let i=0; i<lineas.length; i++) {
            if(lineas[i].includes(sugerido) || lineas[i].includes("ESPN") || lineas[i].includes("TNT Sports")) {
                hallado = lineas[i+1].trim();
                break;
            }
        }

        if(hallado) {
            cargarStream(hallado);
            status.innerHTML = "Sintonizando: " + sugerido;
        } else {
            status.innerHTML = "Buscando señales alternativas en Sudamérica...";
        }
    }

    function cargarStream(url) {
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
        } else { video.src = url; }
    }

    // Encendido total
    encenderMotor();
    motorEspejo();
</script>

</body>
</html>
