<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SÚPER FÉNIX - SISTEMA REMOTO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oro: #d4af37; --negro: #000; --card: #111; }
        body { background: var(--negro); color: white; font-family: sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; border-bottom: 2px solid var(--oro); display: flex; justify-content: space-between; align-items: center; background: #000; }
        .v-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 1px solid #222; }
        video { width: 100%; height: 100%; }
        .main { flex: 1; overflow-y: auto; padding: 15px; background: linear-gradient(180deg, #050505 0%, #000 100%); }
        .sec-t { color: var(--oro); font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin: 20px 0 10px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-c { background: var(--card); border: 1px solid #222; padding: 15px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .btn-c:active { background: var(--oro); color: #000; }
        /* Agenda Estilo Profesional */
        .a-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--oro); display: flex; justify-content: space-between; align-items: center; }
        .a-info b { font-size: 9px; color: var(--oro); }
        .a-info p { margin: 5px 0; font-size: 14px; font-weight: bold; }
        .a-hora { background: #222; padding: 5px 10px; border-radius: 5px; color: var(--oro); font-weight: 900; }
    </style>
</head>
<body>

<header>
    <div style="color:var(--oro); font-weight:900;"><i class="fas fa-fire"></i> SÚPER FÉNIX</div>
    <div id="reloj" style="font-weight:bold;">00:00:00</div>
</header>

<div class="v-box">
    <video id="p-fénix" controls autoplay playsinline></video>
</div>

<div class="main">
    <div class="sec-t">⚽ AGENDA CRÍTICA</div>
    <div id="agenda-din">
        <div class="a-card"><div class="a-info"><b>HOY - ARGENTINA</b><p>Vélez vs Unión</p></div><div class="a-hora">21:00</div></div>
        <div class="a-card" style="border-color: #00ff00;"><div class="a-info"><b>MAÑANA - SUDAMERICANA</b><p>Boca vs Cruzeiro 🇧🇷</p></div><div class="a-hora">21:30</div></div>
    </div>

    <div class="sec-t">📺 SEÑALES (CHILE, BRASIL, ARG)</div>
    <div id="canales-din" class="grid">
        <div style="grid-column: span 2; text-align: center; font-size: 10px; color: #444;">Sincronizando con GitHub...</div>
    </div>
</div>

<script>
    const video = document.getElementById('p-fénix');
    const hls = new Hls();
    setInterval(() => { document.getElementById('reloj').innerText = new Date().toLocaleTimeString(); }, 1000);

    function play(u) {
        if (Hls.isSupported()) { hls.loadSource(u); hls.attachMedia(video); video.play(); }
        else { video.src = u; video.play(); }
    }

    // ESTO CONECTA CON TU LISTA EXTERNA
    async function cargarLista() {
        try {
            // Reemplazá 'TU_USUARIO' por danielujgutierrez-88 para que lea tu archivo canales.m3u
            const res = await fetch("https://raw.githubusercontent.com/danielujgutierrez-88/Lista-canales/main/canales.m3u");
            const data = await res.text();
            const lines = data.split('\n');
            const box = document.getElementById('canales-din');
            box.innerHTML = "";

            for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes('#EXTINF')) {
                    const nombre = lines[i].split(',')[1].trim();
                    const url = lines[i+1].trim();
                    const btn = document.createElement('div');
                    btn.className = 'btn-c';
                    btn.innerHTML = `<i class="fas fa-satellite-dish"></i><br>${nombre}`;
                    btn.onclick = () => play(url);
                    box.appendChild(btn);
                }
            }
        } catch (e) {
            document.getElementById('canales-din').innerHTML = "<small>Crea el archivo 'canales.m3u' en tu GitHub para ver los canales.</small>";
        }
    }
    cargarLista();
</script>
</body>
</html>
