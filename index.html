<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Súper Fénix Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --oro: #d4af37; --bg: #050505; --card: #121212; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Cabecera Profesional */
        header { background: #000; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--oro); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        .logo { font-weight: 900; color: var(--oro); font-size: 22px; display: flex; align-items: center; gap: 10px; }
        #reloj { font-size: 24px; font-weight: 900; color: white; text-shadow: 0 0 10px var(--oro); }

        /* Reproductor con Marco Dorado */
        .v-container { width: 100%; background: #000; aspect-ratio: 16/9; border-bottom: 1px solid #333; position: relative; }
        video { width: 100%; height: 100%; display: block; }
        .status-overlay { position: absolute; bottom: 10px; right: 10px; font-size: 10px; color: var(--oro); font-weight: bold; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; }

        /* Contenido Principal */
        .main-scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .sec-header { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }

        /* Canales en Fila (Scroll Horizontal) */
        .ch-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .ch-card { min-width: 120px; background: var(--card); border: 1px solid #222; border-radius: 10px; padding: 15px 5px; text-align: center; transition: 0.3s; }
        .ch-card i { font-size: 20px; color: var(--oro); margin-bottom: 8px; }
        .ch-card span { display: block; font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-card:active { border-color: var(--oro); background: rgba(212, 175, 55, 0.1); transform: scale(0.95); }

        /* Agenda Estilo "Betano" Profesional */
        .match-box { background: var(--card); border-radius: 12px; margin-bottom: 12px; border-left: 5px solid var(--oro); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-right: 1px solid #222; border-top: 1px solid #222; border-bottom: 1px solid #222; }
        .match-info b { display: block; font-size: 9px; color: var(--oro); text-transform: uppercase; margin-bottom: 5px; }
        .match-info p { margin: 0; font-size: 14px; font-weight: bold; color: #eee; }
        .match-info small { color: #666; font-size: 11px; }
        .match-time { text-align: right; }
        .time-tag { background: #222; padding: 5px 10px; border-radius: 6px; color: var(--oro); font-weight: 900; font-size: 16px; border: 1px solid #333; }
    </style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-bolt"></i> FÉXIX</div>
    <div id="reloj">00:00:00</div>
</header>

<div class="v-container">
    <video id="p-tv" controls autoplay playsinline></video>
    <div class="status-overlay" id="p-status">SISTEMA FÉNIX: STANDBY</div>
</div>

<div class="main-scroll">
    <div class="sec-header"><i class="fas fa-play-circle"></i> Canales en Vivo</div>
    <div class="ch-row" id="list-ch">
        </div>

    <div class="sec-header"><i class="fas fa-calendar-alt"></i> Agenda de Hoy - Domingo 26/04</div>
    <div id="agenda-p">
        <div class="match-box">
            <div class="match-info"><b>Argentina - Liga Profesional</b><p>Boca Juniors vs Racing</p><small>TNT Sports / ESPN Premium</small></div>
            <div class="match-time"><div class="time-tag">21:00</div></div>
        </div>
        <div class="match-box">
            <div class="match-info"><b>Italia - Serie A</b><p>Inter vs Milan</p><small>ESPN / Disney+</small></div>
            <div class="match-time"><div class="time-tag">15:45</div></div>
        </div>
        <div class="match-box">
            <div class="match-info"><b>España - LaLiga</b><p>Real Madrid vs Villarreal</p><small>DSports / ESPN</small></div>
            <div class="match-time"><div class="time-tag">16:00</div></div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('p-tv');
    const hls = new Hls();
    const status = document.getElementById('p-status');

    // 1. Reloj de Precisión
    setInterval(() => {
        document.getElementById('reloj').innerText = new Date().toLocaleTimeString();
    }, 1000);

    function load(u, n) {
        status.innerText = "SINTONIZANDO: " + n.toUpperCase();
        if (Hls.isSupported()) { 
            hls.detachMedia(); 
            hls.loadSource(u); 
            hls.attachMedia(video); 
            video.play(); 
        } else { 
            video.src = u; video.play(); 
        }
    }

    // 2. Buscador Automático de Señales
    async function sync() {
        const res = await fetch("https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u");
        const data = await res.text();
        const lines = data.split('\n');
        const box = document.getElementById('list-ch');

        for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes('#EXTINF')) {
                const n = lines[i].split(',')[1].trim();
                const u = lines[i+1]?.trim();
                const ln = n.toLowerCase();

                // Filtro inteligente de deportes
                if (u && (ln.includes('espn') || ln.includes('tnt') || ln.includes('tyc') || ln.includes('fox') || ln.includes('dsports'))) {
                    const card = document.createElement('div');
                    card.className = 'ch-card';
                    card.innerHTML = `<i class="fas fa-tv"></i><span>${n}</span>`;
                    card.onclick = () => load(u, n);
                    box.appendChild(card);
                    
                    // Test de señal rápido
                    const ab = new AbortController();
                    setTimeout(() => ab.abort(), 800);
                    fetch(u, {method: 'HEAD', mode: 'no-cors', signal: ab.signal}).catch(() => card.remove());
                }
            }
        }
    }

    sync();
</script>
</body>
</html>
