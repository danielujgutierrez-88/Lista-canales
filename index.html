<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fénix TV - Edición Final</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #d4af37; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .reproductor-area { position: sticky; top: 0; background: #000; z-index: 1000; border-bottom: 2px solid #d4af37; }
        video { width: 100%; aspect-ratio: 16/9; background: #111; }
        
        .controles-fijos { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; background: #1a1a1a; padding: 10px; border-bottom: 1px solid #333; }
        .btn-ui { background: #d4af37; color: #000; border: none; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 11px; flex: 1; min-width: 80px; }

        .lista-canales { flex: 1; overflow-y: auto; padding: 15px; background: #050505; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .btn-canal { background: #222; border: 1px solid #444; padding: 15px 5px; color: #fff; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .btn-canal:active { background: #d4af37; color: #000; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; transition: 0.3s; }
    </style>
</head>
<body>

<div id="overlay"></div>

<div class="reproductor-area">
    <video id="tv-player" controls autoplay playsinline></video>
    <div class="controles-fijos">
        <button class="btn-ui" onclick="ajustarVol(0.1)">VOL +</button>
        <button class="btn-ui" onclick="ajustarVol(-0.1)">VOL -</button>
        <button class="btn-ui" onclick="toggleBrillo()">BRILLO</button>
        <button class="btn-ui" onclick="activarPiP()" id="btn-pip">PANTALLA FLOTANTE</button>
    </div>
</div>

<div class="lista-canales">
    <div style="margin-bottom: 10px; border-left: 3px solid #d4af37; padding-left: 10px;">SEÑALES PRINCIPALES</div>
    <div class="grid" id="principales">
        <button class="btn-canal" onclick="conectar('https://television-libre.online/pasatv/telefe.m3u8')">TELEFE</button>
        <button class="btn-canal" onclick="conectar('https://television-libre.online/pasatv/eltrece.m3u8')">EL TRECE</button>
        <button class="btn-canal" onclick="conectar('https://television-libre.online/pasatv/tycsports.m3u8')">TYC SPORTS</button>
        <button class="btn-canal" onclick="conectar('https://television-libre.online/pasatv/cronica.m3u8')">CRÓNICA</button>
    </div>

    <div style="margin: 20px 0 10px; border-left: 3px solid #d4af37; padding-left: 10px;">GRILLA ARGENTINA (AUTO)</div>
    <div class="grid" id="lista-gratis">Cargando...</div>
</div>

<script>
    const player = document.getElementById('tv-player');
    const overlay = document.getElementById('overlay');
    let hls = new Hls();
    let brilloNivel = 0;

    function conectar(url) {
        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(player);
            player.play();
        } else { player.src = url; }
    }

    function ajustarVol(val) { player.volume = Math.min(1, Math.max(0, player.volume + val)); }

    function toggleBrillo() {
        brilloNivel = (brilloNivel + 0.25) % 0.85;
        overlay.style.background = `rgba(0,0,0,${brilloNivel})`;
    }

    async function activarPiP() {
        try {
            if (player !== document.pictureInPictureElement) {
                await player.requestPictureInPicture();
            } else {
                await document.exitPictureInPicture();
            }
        } catch (error) { alert("Tu celular no soporta pantalla flotante todavía."); }
    }

    async function cargarAuto() {
        const res = await fetch("https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u");
        const data = await res.text();
        const lineas = data.split('\n');
        const lista = document.getElementById('lista-gratis');
        lista.innerHTML = "";
        lineas.forEach((l, i) => {
            if (l.includes('#EXTINF')) {
                const n = l.split(',')[1].trim();
                const u = lineas[i+1]?.trim();
                if (u && u.startsWith('http')) {
                    const b = document.createElement('button');
                    b.className = 'btn-canal';
                    b.innerText = n;
                    b.onclick = () => conectar(u);
                    lista.appendChild(b);
                }
            }
        });
    }
    cargarAuto();
</script>
</body>
</html>
