<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fénix TV - Estabilidad Total</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #d4af37; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .cabecera-fija { position: sticky; top: 0; background: #000; z-index: 1000; border-bottom: 2px solid #d4af37; }
        video { width: 100%; aspect-ratio: 16/9; background: #111; display: block; }
        
        .controles-deslizantes { background: #1a1a1a; padding: 15px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #333; }
        .control-item { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 11px; font-weight: bold; }
        input[type=range] { flex: 1; accent-color: #d4af37; height: 6px; }

        .contenedor-canales { flex: 1; overflow-y: auto; padding: 15px; }
        .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; }
        .boton-canal { background: #222; border: 1px solid #444; padding: 12px 5px; color: #fff; border-radius: 8px; font-size: 10px; min-height: 55px; font-weight: bold; }
        .boton-canal:active { background: #d4af37; color: #000; transform: scale(0.95); }
        .cargando { text-align: center; font-size: 12px; color: #888; padding: 10px; }
    </style>
</head>
<body>

<div class="cabecera-fija">
    <video id="reproductor" controls autoplay playsinline></video>
    <div class="controles-deslizantes">
        <div class="control-item"><span>VOL</span><input type="range" min="0" max="1" step="0.1" value="1" id="ctrl-vol"></div>
        <div class="control-item"><span>BRI</span><input type="range" min="30" max="150" value="100" id="ctrl-bri"></div>
    </div>
</div>

<div class="contenedor-canales">
    <div id="msg" class="cargando">Verificando señales activas...</div>
    <div class="grilla" id="lista"></div>
</div>

<script>
    const video = document.getElementById('reproductor');
    const hls = new Hls({
        manifestLoadingTimeOut: 10000,
        fragLoadingTimeOut: 10000
    });

    function sintonizar(url) {
        // Forzamos la limpieza del reproductor para evitar la "imagen rota"
        if (Hls.isSupported()) {
            hls.detachMedia();
            hls.loadSource(url);
            hls.attachMedia(video);
            video.play().catch(() => console.log("Error de reproducción"));
        } else {
            video.src = url;
        }
    }

    // Controles táctiles
    document.getElementById('ctrl-vol').oninput = (e) => video.volume = e.target.value;
    document.getElementById('ctrl-bri').oninput = (e) => document.body.style.filter = `brightness(${e.target.value}%)`;

    async function obtenerCanales() {
        try {
            // Usamos una lista de respaldo más estable
            const res = await fetch("https://iptv-org.github.io/iptv/countries/ar.m3u");
            const texto = await res.text();
            const lineas = texto.split('\n');
            const lista = document.getElementById('lista');
            lista.innerHTML = "";

            for (let i = 0; i < lineas.length; i++) {
                if (lineas[i].includes('#EXTINF')) {
                    const nombre = lineas[i].split(',')[1].trim();
                    const url = lineas[i+1]?.trim();

                    if (url && url.startsWith('http')) {
                        const btn = document.createElement('button');
                        btn.className = 'boton-canal';
                        btn.innerText = nombre;
                        btn.onclick = () => sintonizar(url);
                        lista.appendChild(btn);
                    }
                }
            }
            document.getElementById('msg').innerText = "Señales listas para sintonizar.";
        } catch (e) {
            document.getElementById('msg').innerText = "Error de conexión. Reintentando...";
        }
    }
    obtenerCanales();
</script>
</body>
</html>
