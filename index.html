<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SÚPER FÉNIX - MOTOR DE ALTA SEÑAL</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --oro: #d4af37; --negro: #0b0b0b; --gris: #1a1a1a; }
        body { background: var(--negro); color: #fff; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        #reproductor-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 2px solid var(--oro); position: sticky; top: 0; z-index: 1000; }
        video { width: 100%; height: 100%; }
        .status-bar { font-size: 10px; color: var(--oro); text-align: center; padding: 8px; background: #111; text-transform: uppercase; letter-spacing: 1px; }
        .cont { padding: 15px; }
        .seccion-titulo { color: var(--oro); font-size: 14px; font-weight: bold; margin: 15px 0; border-left: 3px solid var(--oro); padding-left: 10px; }
        .grilla-auto { display: grid; gap: 12px; }
        .tarjeta { background: var(--gris); border: 1px solid #333; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .tarjeta:active { transform: scale(0.97); background: #222; }
        .info b { color: var(--oro); display: block; margin-bottom: 3px; }
        .badge-espejo { font-size: 9px; color: #888; border: 1px solid #444; padding: 2px 4px; border-radius: 3px; }
        .hora { background: #000; color: var(--oro); padding: 5px 10px; border-radius: 5px; font-weight: bold; border: 1px solid var(--oro); }
    </style>
</head>
<body>

<div id="reproductor-box">
    <video id="video" controls autoplay playsinline></video>
</div>
<div id="motor-info" class="status-bar">Escaneando mejores señales...</div>

<div class="cont">
    <div class="seccion-titulo">📺 TELEVISIÓN DE AIRE (ALTA ESTABILIDAD)</div>
    <div id="tv-status" style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Buscando repetidora con mejor flujo...</div>

    <div class="seccion-titulo">⚽ AGENDA DEPORTIVA AUTOMÁTICA (ESPEJO)</div>
    <div id="grilla-futbol" class="grilla-auto">
        <p style="color:#555">Sincronizando partidos del día...</p>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const hls = new Hls();
    const statusTxt = document.getElementById('motor-info');
    const masterList = "https://raw.githubusercontent.com/free-tv/iptv/main/playlist.m3u8";

    // 1. MOTOR DE BÚSQUEDA DE MEJOR SEÑAL (Aire/Provincia/Radio)
    async function sintonizarMejorSenal() {
        try {
            const res = await fetch(masterList);
            const data = await res.text();
            const lineas = data.split('\n');
            
            // Filtro inteligente: Busca repetidoras o canales de aire que NO sean los pesados de Capital
            for(let i=0; i<lineas.length; i++) {
                if(lineas[i].includes("Argentina") && !lineas[i].includes("youtube")) {
                    // Prioriza canales que suelen ser más livianos (Provinciales, Radios, Repetidoras)
                    if(lineas[i].includes("MDS") || lineas[i].includes("12") || lineas[i].includes("8") || lineas[i].includes("TVP")) {
                        cargarStream(lineas[i+1].trim());
                        document.getElementById('tv-status').innerHTML = "Conectado a: " + lineas[i].split(',')[1];
                        statusTxt.innerHTML = "Señal de alta estabilidad detectada";
                        break;
                    }
                }
            }
        } catch(e) { statusTxt.innerHTML = "Error de conexión. Reintentando espejo..."; }
    }

    // 2. BUSCADOR DE FÚTBOL (Espejo + Antibloqueo)
    async function buscarPartido(termino, sugerido) {
        statusTxt.innerHTML = "Sincronizando modo espejo para " + termino + "...";
        const res = await fetch(masterList);
        const data = await res.text();
        const lineas = data.split('\n');
        
        let linkHallado = "";
        for(let i=0; i<lineas.length; i++) {
            if((lineas[i].includes(sugerido) || lineas[i].includes("ESPN") || lineas[i].includes("TNT")) && !lineas[i].includes("youtube")) {
                linkHallado = lineas[i+1].trim();
                break;
            }
        }
        if(linkHallado) {
            cargarStream(linkHallado);
            statusTxt.innerHTML = "Transmitiendo con delay de seguridad (Antibloqueo)";
        }
    }

    // 3. AGENDA AUTOMÁTICA (Tipo Betano)
    async function actualizarAgenda() {
        const grilla = document.getElementById('grilla-futbol');
        try {
            const res = await fetch('https://raw.githubusercontent.com/Santi-68/agenda-deportiva/main/hoy.json');
            const agenda = await res.json();
            grilla.innerHTML = "";
            agenda.eventos.forEach(ev => {
                const card = document.createElement('div');
                card.className = 'tarjeta';
                card.onclick = () => buscarPartido(ev.nombre, ev.canal_sugerido);
                card.innerHTML = `
                    <div class="info">
                        <b>${ev.torneo}</b>
                        <span>${ev.nombre}</span>
                        <div class="badge-espejo">RETRANSMISIÓN ESPEJO</div>
                    </div>
                    <div class="hora">${ev.hora}</div>
                `;
                grilla.appendChild(card);
            });
        } catch(e) {
            grilla.innerHTML = "<div class='tarjeta' onclick='buscarPartido(\"Manchester\", \"ESPN\")'><div class='info'><b>PREMIER LEAGUE</b><span>Man. United vs Brentford</span></div><div class='hora'>14:00</div></div>";
        }
    }

    function cargarStream(url) {
        if (Hls.isSupported()) {
            hls.loadSource(url);
            hls.attachMedia(video);
        } else { video.src = url; }
    }

    // ARRANQUE DE SISTEMAS
    sintonizarMejorSenal();
    actualizarAgenda();
</script>
</body>
</html>
