<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fénix TV - Versión Recuperada</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #d4af37; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .reproductor-fijo { position: sticky; top: 0; background: #000; z-index: 1000; border-bottom: 2px solid #d4af37; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        
        .panel-deslizadores { background: #111; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #333; }
        .fila-control { display: flex; align-items: center; gap: 10px; color: #aaa; font-size: 11px; font-weight: bold; }
        input[type=range] { flex: 1; accent-color: #d4af37; height: 6px; }

        .lista-canales { flex: 1; overflow-y: auto; padding: 15px; background: #050505; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; }
        .btn-canal { background: #1a1a1a; border: 1px solid #333; padding: 15px 5px; color: #fff; border-radius: 8px; font-size: 10px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; }
        .btn-canal:active { background: #d4af37; color: #000; }
        #status { font-size: 11px; color: #666; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="reproductor-fijo">
    <video id="player" controls autoplay playsinline></video>
    <div class="panel-deslizadores">
        <div class="fila-control">
            <span>VOL</span>
            <input type="range" min="0" max="1" step="0.1" value="1" id="vol-control">
        </div>
        <div class="fila-control">
            <span>BRILLO</span>
            <input type="range" min="30" max="150" value="100" id="bri-control">
        </div>
    </div>
</div>

<div class="lista-canales">
    <div id="status">Sincronizando señales (incluyendo Bayres, América y más)...</div>
    <div class="grid" id="contenedor"></div>
</div>

<script>
    const player = document.getElementById('player');
    const hls = new Hls();

    function conectar(url) {
        if (Hls.isSupported()) {
            hls.destroy();
            hls.loadSource(url);
            hls.attachMedia(player);
            player.play();
        } else { player.src = url; }
    }

    // Controles de Volumen y Brillo
    document.getElementById('vol-control').oninput = (e) => player.volume = e.target.value;
    document.getElementById('bri-control').oninput = (e) => document.body.style.filter = `brightness(${e.target.value}%)`;

    // Cargador de la lista que te funcionaba antes
    async function cargarCanales() {
        try {
            const res = await fetch("https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u");
            const data = await res.text();
            const lineas = data.split('\n');
            const contenedor = document.getElementById('contenedor');
            contenedor.innerHTML = "";

            for (let i = 0; i < lineas.length; i++) {
                if (lineas[i].includes('#EXTINF')) {
                    const nombre = lineas[i].split(',')[1].trim();
                    const url = lineas[i+1]?.trim();

                    if (url && url.startsWith('http')) {
                        const btn = document.createElement('button');
                        btn.className = 'btn-canal';
                        btn.innerText = nombre;
                        btn.onclick = () => conectar(url);
                        contenedor.appendChild(btn);
                    }
                }
            }
            document.getElementById('status').innerText = "Lista cargada. Buscá Bayres o América abajo.";
        } catch (e) {
            document.getElementById('status').innerText = "Error al cargar canales.";
        }
    }
    cargarCanales();
</script>
</body>
</html>
