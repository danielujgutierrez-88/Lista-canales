<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fénix TV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; color: #d4af37; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .reproductor-box { position: sticky; top: 0; background: #000; z-index: 1000; border-bottom: 2px solid #d4af37; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        
        .controles-inteligentes { background: #111; padding: 12px; border-bottom: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .slider-group { display: flex; align-items: center; gap: 10px; color: #888; font-size: 10px; font-weight: bold; }
        input[type=range] { flex: 1; accent-color: #d4af37; height: 4px; cursor: pointer; }

        .lista-canales { flex: 1; overflow-y: auto; padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .btn-canal { background: #1a1a1a; border: 1px solid #333; padding: 15px 5px; color: #fff; border-radius: 8px; font-size: 11px; text-align: center; }
        .btn-canal:active { background: #d4af37; color: #000; }
        
        #status-bar { font-size: 10px; color: #666; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="reproductor-box">
    <video id="player" controls autoplay playsinline></video>
    <div class="controles-inteligentes">
        <div class="slider-group">
            <span>VOL</span>
            <input type="range" min="0" max="1" step="0.05" value="1" id="vol">
        </div>
        <div class="slider-group">
            <span>BRILLO</span>
            <input type="range" min="20" max="150" value="100" id="bri">
        </div>
    </div>
</div>

<div class="lista-canales">
    <div id="status-bar">Sintonizando señales activas de Argentina...</div>
    <div class="grid" id="lista"></div>
</div>

<script>
    const player = document.getElementById('player');
    const hls = new Hls();
    const vol = document.getElementById('vol');
    const bri = document.getElementById('bri');

    function sintonizar(url) {
        if (Hls.isSupported()) {
            hls.destroy();
            hls.loadSource(url);
            hls.attachMedia(player);
            player.play().catch(() => {
                console.log("Error al reproducir");
            });
        } else { player.src = url; }
    }

    vol.oninput = (e) => player.volume = e.target.value;
    bri.oninput = (e) => document.body.style.filter = `brightness(${e.target.value}%)`;

    async function cargarGuia() {
        // Usamos una fuente más confiable y procesamos los datos
        const fuentes = [
            "https://raw.githubusercontent.com/Iptv-org/iptv/master/streams/ar.m3u",
            "https://iptv-org.github.io/iptv/countries/ar.m3u"
        ];

        try {
            const res = await fetch(fuentes[0]);
            const data = await res.text();
            const lineas = data.split('\n');
            const lista = document.getElementById('lista');
            lista.innerHTML = "";

            for (let i = 0; i < lineas.length; i++) {
                if (lineas[i].includes('#EXTINF')) {
                    const nombre = lineas[i].split(',')[1].trim();
                    const url = lineas[i+1]?.trim();

                    if (url && url.startsWith('http')) {
                        const btn = document.createElement('button');
                        btn.className = 'btn-canal';
                        btn.innerText = nombre;
                        btn.onclick = () => sintonizar(url);
                        lista.appendChild(btn);

                        // Filtro silencioso: si el link da error rápido, quitamos el botón
                        fetch(url, { method: 'HEAD', mode: 'no-cors' }).catch(() => {
                            btn.style.display = 'none';
                        });
                    }
                }
            }
            document.getElementById('status-bar').innerText = "Grilla actualizada. Seleccioná un canal.";
        } catch (e) {
            document.getElementById('status-bar').innerText = "Error de conexión. Reintentando...";
        }
    }

    cargarGuia();
</script>
</body>
</html>
